name: 📈 Update GitHub Profile README

on:
  schedule:
    - cron: "0 */2 * * *"  # Every 2 hours
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v3

      - name: 🐍 Generate Snake Animation
        uses: Platane/snk@v3
        with:
          github_user_name: RahulNeuroByte
          outputs: |
            ./assets/github-contribution-grid-snake.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}  # ✅ You’re using GH_PAT as GITHUB_TOKEN here (okay if the Snake action accepts it)

      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: 📦 Install dependencies
        run: |
          pip install -r requirements.txt

      - name: 🧠 Generate Visuals
        run: python Scripts/generate-visuals.py
        env:
          GH_PAT: ${{ secrets.GH_PAT }}  # ✅ Correctly passed

      - name: 🧾 Generate README
        run: python Scripts/generate_readme.py
        env:
          GH_PAT: ${{ secrets.GH_PAT }}  # ✅ Missing earlier, added now

      - name: 🚀 Commit & Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md visual_stats/*.png assets/github-contribution-grid-snake.svg
          git diff --cached --quiet || git commit -m "📊 Auto-update README and charts"
          git push